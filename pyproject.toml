[project]
name = "superturtle"
version = "1.4.0"
description = "Extensions to Python's turtle"
authors = [
    {name="Chris Proctor", email="chris@chrisproctor.net"}
]
license = {text = "MIT"}
readme = "README.md"
documentation = "https://docs.makingwithcode.org/superturtle"
requires-python = ">=3.10,<4.0"
dependencies = []

[dependency-groups]
docs = [
    "sphinx>=7.0.1,<8",
    "furo>=2023.5.20",
]
dev = [
    "pytest>=5.2",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"
